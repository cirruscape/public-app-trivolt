AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: >-
  Quiz App foundation (PLAN §9): DynamoDB table, Cognito user pool for Hosts and
  its WAF web ACL,
  ECR repository for the generation agent, Player token signing secret and
  runtime parameters. Stack name: quizapp-{env}-foundation.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment environment.

Conditions:
  IsProd: !Equals [!Ref Env, prod]

Resources:
  # ---------------------------------------------------------------- Data
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      TableName: !Sub quizapp-${Env}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        # Sparse index of unfinished Games by lastActivityAt, for the abandonment sweeper.
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------- Host auth
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolName: !Sub quizapp-${Env}-hosts
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub quizapp-${Env}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # Lets IAM-authenticated callers (the smoke test) sign a test Host in without a browser.
        # It needs cognito-idp:AdminInitiateAuth, so it isn't open to the public.
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ---------------------------------------------------------------- Host auth firewall
  # Filters the user pool's public endpoints (sign-up, confirmation, SRP sign-in, password
  # reset): New Zealand only, plus AWS managed protections. Cognito doesn't send IAM-signed
  # Admin* calls (the smoke test and seed scripts) through WAF, so CI runners outside NZ still
  # work. Players never touch Cognito, so joining a Game isn't affected.
  UserPoolWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub quizapp-${Env}-hosts
      Description: Host sign-up and sign-in from New Zealand only, with AWS managed protections.
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub quizapp-${Env}-hosts
      Rules:
        - Name: AllowNewZealandOnly
          Priority: 0
          Action: { Block: {} }
          Statement:
            NotStatement:
              Statement:
                GeoMatchStatement:
                  CountryCodes: [NZ]
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AllowNewZealandOnly
        # Botnets, scanners and other known-malicious IPs.
        - Name: AmazonIpReputationList
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AmazonIpReputationList
        # VPNs, Tor exit nodes, proxies and hosting providers, which could also be used to
        # appear to be in NZ.
        - Name: AnonymousIpList
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAnonymousIpList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AnonymousIpList
        # Slows credential stuffing and sign-up abuse. A real Host makes a handful of calls to
        # sign up and sign in.
        - Name: RateLimitPerIp
          Priority: 3
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 100
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIp
        - Name: KnownBadInputs
          Priority: 4
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputs
        - Name: CommonRuleSet
          Priority: 5
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSet

  UserPoolWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !GetAtt UserPool.Arn
      WebACLArn: !GetAtt UserPoolWebAcl.Arn

  # WAF requires the aws-waf-logs- prefix. Only blocked requests are logged.
  UserPoolWebAclLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub aws-waf-logs-quizapp-${Env}-hosts
      RetentionInDays: 30

  UserPoolWebAclLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt UserPoolWebAcl.Arn
      # The log group ARN without the trailing :* that GetAtt returns.
      LogDestinationConfigs:
        - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${UserPoolWebAclLogGroup}
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition: { Action: BLOCK }

  # ---------------------------------------------------------------- Agent image
  AgentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub quizapp-${Env}-agent
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EmptyOnDelete: !If [IsProd, false, true]
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the 20 most recent images",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 20 },
              "action": { "type": "expire" }
            }]
          }

  # ---------------------------------------------------------------- Secrets and parameters
  PlayerTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub quizapp/${Env}/player-token-key
      Description: HS256 signing key for Player tokens (PLAN §5).
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ToxicityThresholdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /quizapp/${Env}/toxicityThreshold
      Type: String
      Value: '0.5'
      Description: Reject a Nickname if any Comprehend toxicity category scores at or above this (FR-5.3).

Outputs:
  TableName:
    Value: !Ref Table
    Export:
      Name: !Sub quizapp-${Env}-TableName
  TableArn:
    Value: !GetAtt Table.Arn
    Export:
      Name: !Sub quizapp-${Env}-TableArn
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub quizapp-${Env}-UserPoolId
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub quizapp-${Env}-UserPoolArn
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub quizapp-${Env}-UserPoolClientId
  AgentRepositoryUri:
    Value: !GetAtt AgentRepository.RepositoryUri
    Export:
      Name: !Sub quizapp-${Env}-AgentRepositoryUri
  PlayerTokenSecretArn:
    Value: !Ref PlayerTokenSecret
    Export:
      Name: !Sub quizapp-${Env}-PlayerTokenSecretArn
  ToxicityThresholdParameterName:
    Value: !Ref ToxicityThresholdParameter
    Export:
      Name: !Sub quizapp-${Env}-ToxicityThresholdParameterName
